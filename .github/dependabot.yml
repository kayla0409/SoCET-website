# Dependabot opens PRs to update dependencies, batched weekly so they don't
# flood the PR list. Security fixes arrive right away once Dependabot alerts
# and security updates are turned on in the repo's Settings (admin only).
# Every Dependabot PR still needs CI and a review to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor and patch updates; majors arrive one at a time.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    ignore:
      # @types/node must match the Node version we run on (.nvmrc, engines).
      # Newer majors would let code use APIs that crash on our runtime. When
      # we upgrade Node, bump .nvmrc, engines, Vercel and @types/node together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
